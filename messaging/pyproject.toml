[project]
name = "retouren-messaging"
version = "0.1.0"
description = "Status-Updates der Retourenbearbeitung ueber RabbitMQ"
requires-python = ">=3.15"
dependencies = [
    "pika>=1.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
